name: Ingest 13F filings

on:
  schedule:
    # Hourly, at minute 17 rather than :00 because GitHub delays or drops
    # scheduled runs most at the top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --investor warren-buffett --force"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest
        # Passed through env, not interpolated into the script, to avoid shell injection.
        run: npm run ingest -- $INGEST_ARGS
        env:
          INGEST_ARGS: ${{ inputs.args }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}

      # Commit only when the data changed, so Vercel rebuilds only for new filings.
      - name: Commit data changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update 13F filings"
          git pull --rebase
          git push
