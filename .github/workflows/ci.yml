name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Validates data/investors.json and rebuilds data/portfolios; fails if the committed output is stale.
      - run: |
          npm run derive
          git status --porcelain data
          test -z "$(git status --porcelain data)"
      - run: npm run build
